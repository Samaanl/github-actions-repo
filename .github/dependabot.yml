# Automated dependency updates.
#
# The second block is the one most people forget: it keeps your *pinned GitHub
# Action versions* current. Without it, SHA-pinning your actions (which is the
# secure thing to do) becomes a manual maintenance burden and people stop doing
# it. Dependabot is what makes the secure option sustainable.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
