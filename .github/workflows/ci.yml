# =============================================================================
#  CI  -  Continuous Integration
# =============================================================================
#  This is the "CI" half of CI/CD. It runs on every push and every pull request
#  and answers one question: "is this code safe to merge?"
#
#  Pipeline shape:
#
#        lint  ──►  test (6 parallel jobs)  ──►  build  ──►  ci-passed
#       (fast)         (matrix fan-out)        (artifact)     (gate)
#
#  Every line below is commented because this file is explained slide-by-slide
#  during the presentation.
# =============================================================================

name: CI

# --- 1. TRIGGERS (events) ----------------------------------------------------
# "on" decides WHEN the workflow runs. This is the event-driven core of Actions.
on:
  push:
    branches: [main, develop]
    paths-ignore: # don't burn CI minutes on docs-only commits
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# --- 2. PERMISSIONS (security) ----------------------------------------------
# The automatic GITHUB_TOKEN gets the *least privilege* it needs.
# Default it to read-only at the top, then widen per-job only where required.
permissions:
  contents: read

# --- 3. CONCURRENCY ----------------------------------------------------------
# If someone pushes twice in 10 seconds, cancel the older run.
# Saves minutes and stops two runs racing to report a status.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- 4. WORKFLOW-LEVEL DEFAULTS ---------------------------------------------
env:
  NODE_VERSION_DEFAULT: '20'

jobs:
  # ===========================================================================
  #  JOB 1 - LINT
  #  Cheapest gate first. If the code style is broken there is no point
  #  spending 6 machines on tests. This is the "fail fast" principle.
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout clones the repo into the runner. Without it the
      # runner is an empty machine - it does NOT have your code by default.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: npm # caches ~/.npm between runs -> much faster installs

      - name: Install dependencies
        run: npm ci # `ci` not `install`: exact, reproducible, lockfile-driven

      - name: Run ESLint
        run: npm run lint

  # ===========================================================================
  #  JOB 2 - TEST (MATRIX)
  #  One job definition expands into 6 parallel jobs:
  #  {ubuntu, windows} x {Node 20, 22, 24}. This is what proves the app works
  #  on more than "it works on my machine".
  #
  #  NOTE: `npm test` runs plain `node --test` with no path argument, so Node
  #  auto-discovers **/*.test.js. That is deliberate - glob arguments such as
  #  `node --test "test/**/*.test.js"` are only supported on Node 22+, so a
  #  glob here would fail on the older rows of this very matrix. Which is
  #  exactly the class of bug a matrix exists to catch.
  # ===========================================================================
  test:
    name: Test · Node ${{ matrix.node }} · ${{ matrix.os }}
    needs: lint # dependency: only starts after lint is green
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false # let all 6 finish so we see the full picture
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Only collect coverage once (on the "primary" combination) instead of
      # 6 times - the other 5 runs exist to check portability, not coverage.
      # Node 22 specifically: the lcov test reporter was added in Node 22.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage

      # Artifacts let a later job (or a human) download files a job produced.
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # Writes Markdown to the run's summary page - great for the live demo,
      # because the class sees a human-readable result, not just a green tick.
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Test result"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| OS | \`${{ matrix.os }}\` |"
            echo "| Node | \`${{ matrix.node }}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  #  JOB 3 - BUILD
  #  Produces the deployable artifact once, after tests pass.
  #  "Build once, deploy many" - the same dist/ is what gets released.
  # ===========================================================================
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 7

      - name: Report build contents
        run: |
          {
            echo "### Build artifact"
            echo ""
            echo '```'
            ls -la dist/
            echo '```'
            echo ""
            echo '**build-info.json**'
            echo '```json'
            cat dist/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  #  JOB 4 - GATE
  #  A single job that succeeds only if everything above succeeded.
  #  Handy as the ONE required status check in branch protection rules,
  #  instead of listing all 6 matrix jobs by name.
  # ===========================================================================
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          echo "lint  = ${{ needs.lint.result }}"
          echo "test  = ${{ needs.test.result }}"
          echo "build = ${{ needs.build.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed - blocking the merge."
            exit 1
          fi
          echo "All CI jobs green."
