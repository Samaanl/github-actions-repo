# =============================================================================
#  DOCKER  -  build a container image and push it to GitHub Container Registry
# =============================================================================
#  OPTIONAL / ADVANCED. Include this only if you have time in the presentation.
#  It shows two things the simple workflows do not:
#    1. Packaging the app as an immutable, versioned artifact (an image).
#    2. Authenticating to a registry using the built-in GITHUB_TOKEN -
#       no username/password, no secret to leak.
#
#  After the first successful run the image is at:
#      ghcr.io/<owner>/<repo>:latest
# =============================================================================

name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write # required to push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Buildx enables layer caching and multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-generated, expires with the run

      # Derives sensible tags/labels from the git ref:
      #   push to main  -> :main, :sha-abc1234
      #   push tag v1.2.0 -> :1.2.0, :1.2, :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull it with:"
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
